name: Release

# Builds the MIA firmware with the Pico SDK version CMakeLists.txt names.
# Every push and pull request builds mia.uf2 and the diagnostic mia-diag.uf2;
# a v* tag also attaches them and SHA256SUMS to that GitHub release. A tag with
# a prerelease suffix (v0.1.0-alpha.1) makes a prerelease. Release images hold
# no Wi-Fi credentials: MIA reads them from WIFI.CFG on the SD card.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev
      - name: Fetch the Pico SDK
        run: |
          version="$(sed -n 's/^set(sdkVersion \(.*\))$/\1/p' CMakeLists.txt)"
          git clone --depth 1 --branch "$version" https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"
      - name: Build
        run: |
          make release
          make diag
          mkdir -p dist
          cp build/mia.uf2 dist/mia.uf2
          cp build-diag/mia.uf2 dist/mia-diag.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.uf2
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Attach the firmware to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
